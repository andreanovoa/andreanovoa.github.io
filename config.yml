baseURL: "https://andreanovoa.github.io/" 
relativeURLs: true
canonifyURLs: false
title: Andrea Nóvoa
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        # - name: Books
        #   url: books/
        #   weight: 5 
        - name: Publications
          url: papers/
          weight: 1
        - name: Talks
          url: talks/
          weight: 2
        - name: Activities
          url: outreach/
          weight: 3
        - name: Students
          url: students/
          weight: 4

params:
    labSite: "https://sciml-da.github.io/"
    description: "This website hosts Andrea Nóvoa's research papers, course materials, data, curriculum vitae, and contact information."
    author: Andrea Nóvoa
    defaultTheme: dark
    defaultColor: blue
    hideFooter: false
    disableThemeToggle: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","talks","cv"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Andrea Nóvoa
          subtitle: "Assistant Professor in Data Assimilation"
          subtitleInst: "Aeronautics Department | Imperial College London"
          subsubtitle: "Eric & Wendy Schmidt AI in Science Fellow"
          subsubtitleInst: "I-X Institute | Imperial College London"
          imageUrl: "headshot_wb.jpg"
          imageWidth: 200
          imageHeight: 200
          icon: "favicon-32x32.png"
          buttons:
            - name: CV
              url: cv/
            - name: Publications
              url: papers/
            - name: Talks
              url: talks/
            - name: Activities
              url: outreach/
            - name: Students
              url: students/

    socialIcons:
        - name: Cv
          title: CV
          url: cv/
        - name: Email
          url: mailto:a[dot]novoa[at]imperial.ac.uk
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=X0TjtAgAAAAJ&hl=en
        - name: OrcID
          url: https://orcid.org/0000-0003-0597-8326
        - name: GitHub
          url: https://github.com/andreanovoa
        - name: Linkedin
          url: https://www.linkedin.com/in/andreanovoamartinez/
        
    
    assets:
        disableScrollBarStyle: true
        disableFeatherIcons: false
    enableFontAwesome: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Andrea Nóvoa"
      icon: "favicon-32x32.png"
      size:  16

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: monokai 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
