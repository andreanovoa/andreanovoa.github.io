{{ define "main" }}
<article class="page">
  {{- with .Params.backLink }}
  <p class="back-link"><a href="{{ . }}">{{ $.Params.backLabel | default "&larr; Back" | safeHTML }}</a>
  {{- if $.Params.hideHeader }} <button class="page-theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark and light theme" title="Toggle dark and light theme"></button>{{ end }}</p>
  {{- end }}
  {{- if not .Params.hideTitle }}<h1 class="page-title">{{ .Title }}</h1>{{ end }}
  {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
