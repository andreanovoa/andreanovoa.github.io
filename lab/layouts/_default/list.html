{{ define "main" }}
<article class="page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
  {{ with .Pages }}
  <ul class="plain-list">
    {{- range . }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{- end }}
  </ul>
  {{ end }}
</article>
{{ end }}
