<footer class="site-footer">
  <div class="wrap footer-inner">
    <div>
      <strong>{{ site.Params.shortTitle }}</strong><br>
      <span class="muted">{{ site.Params.institution }}</span>
    </div>
    <div class="footer-links">
      <a href="mailto:{{ site.Params.email }}">Email</a>
      <a href="{{ site.Params.scholar }}">Scholar</a>
      <a href="{{ site.Params.github }}">GitHub</a>
      <a href="{{ site.Params.orcid }}">ORCID</a>
      <a href="{{ site.Params.personalSite }}">PI homepage</a>
    </div>
    {{- with site.Params.goatCounterCode }}
    <div class="footer-links">
      <a class="goatcounter-badge" href="https://{{ . }}.goatcounter.com/" rel="noopener noreferrer" target="_blank" title="Site visit stats" style="display:inline-flex;align-items:center;gap:0.35em;font-size:inherit;line-height:inherit;text-decoration:none;">
        <span aria-hidden="true">&bull;</span>
        <span id="goatcounter-count"></span>
      </a>
    </div>
    <script data-goatcounter="https://{{ . }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
        /* GoatCounter's visit_count() widget draws into a cross-origin iframe,
           so its number can be neither restyled nor read. Fetch the counter
           endpoint directly and render just the digits. Site total first, the
           current page as a fallback; if neither answers, the badge stays as
           the dot alone. */
        (function () {
            var base = 'https://{{ . }}.goatcounter.com/counter/';
            var el = document.getElementById('goatcounter-count');
            function show(value) {
                if (!el || value === undefined || value === null) return;
                var digits = String(value).replace(/[^\d.,]/g, '');
                if (digits) el.textContent = digits;
            }
            function grab(url) {
                return fetch(url).then(function (r) {
                    if (!r.ok) throw new Error(r.status);
                    return r.json();
                });
            }
            grab(base + 'TOTAL.json')
                .then(function (d) { show(d.count); })
                .catch(function () {
                    grab(base + encodeURIComponent(location.pathname) + '.json')
                        .then(function (d) { show(d.count); })
                        .catch(function () { /* counter unavailable: dot only */ });
                });
        })();
    </script>
    {{- end }}
  </div>
</footer>
