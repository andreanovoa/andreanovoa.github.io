{{ define "main" }}
<article class="page">
  <h1 class="page-title">{{ .Title }}</h1>
  {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
  <div class="cards">
    {{- range .Pages.ByWeight }}
    <a class="card"{{ with .Params.weight }} data-topic="{{ . }}"{{ end }} href="{{ .RelPermalink }}">
      <h3>{{ .Title }}</h3>
      <p>{{ .Params.blurb }}</p>
      <span class="card-cta">Read more &rarr;</span>
    </a>
    {{- end }}
  </div>
</article>
{{ end }}
