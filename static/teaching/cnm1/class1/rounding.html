<script>
"use strict";
/* =====================================================================================
   Exact rational arithmetic (BigInt): rounding and chopping never go through binary floats.
   A number is {neg, N, D} with N, D > 0 coprime BigInts.
   ===================================================================================== */
const babs=a=>a<0n?-a:a;
const BP=(b,n)=>BigInt(b)**BigInt(n);
const bitlen=a=>a===0n?0:a.toString(2).length;
function gcd(a,b){a=babs(a);b=babs(b);while(b){const t=a%b;a=b;b=t;}return a||1n;}
/* a / b as a Number (b > 0) */
function ratio(a,b){if(a===0n)return 0;const neg=a<0n;if(neg)a=-a;
  const sh=bitlen(b)-bitlen(a)+64;const q=sh>=0?(a<<BigInt(sh))/b:a/(b<<BigInt(-sh));
  let v=Number(q),e=-sh;while(e>900){v*=2**900;e-=900;}while(e<-900){v*=2**-900;e+=900;}v*=2**e;return neg?-v:v;}
/* "1.3475", "-2.5e3" or "2/3" -> exact {neg, N, D} */
function parseX(str){
  const s=String(str).trim().replace(/[−–]/g,'-').replace(/[\s,_]+/g,'');
  let m=s.match(/^([+-])?(\d+)\/(\d+)$/);
  if(m){const N=BigInt(m[2]),D=BigInt(m[3]);if(D===0n)throw new Error('The denominator must not be 0.');const g=gcd(N,D);return{neg:m[1]==='-'&&N>0n,N:N/g,D:D/g};}
  m=s.match(/^([+-])?(\d*)(?:\.(\d*))?(?:e([+-]?\d+))?$/i);
  if(!m||(!m[2]&&!m[3]))throw new Error('Type a decimal number such as 1.3475, or a fraction such as 2/3.');
  const ip=m[2]||'',fp=m[3]||'',ex=m[4]?parseInt(m[4],10):0;
  if(Math.abs(ex)>60||(ip+fp).length>60)throw new Error('Use at most 60 digits and |exponent| ≤ 60.');
  let N=BigInt((ip+fp)||'0'),D=BP(10,fp.length);if(ex>0)N*=BP(10,ex);else if(ex<0)D*=BP(10,-ex);
  const g=gcd(N,D);return{neg:m[1]==='-'&&N>0n,N:N/g,D:D/g};}
/* floor(log_b |x|) */
function Eb(x,b){const B=BigInt(b);let g=Math.floor(Math.log(ratio(x.N,x.D))/Math.log(b));
  const geq=g=>g>=0?x.N>=x.D*B**BigInt(g):x.N*B**BigInt(-g)>=x.D;
  while(!geq(g))g--;while(geq(g+1))g++;return g;}
/* keep k places after the point in base b (k may be negative): chopped magnitude t, rounded rr (ties to even) */
function quant(x,k,b){const B=BigInt(b),sn=k>=0?x.N*B**BigInt(k):x.N,sd=k>=0?x.D:x.D*B**BigInt(-k);
  const t=sn/sd,r=sn-t*sd,tie=2n*r===sd,above=2n*r>sd,up=above||(tie&&(t&1n)===1n);
  return{k,t,r,sd,tie,above,exact:r===0n,rr:up?t+1n:t,up,f:ratio(r,sd)};}
/* ε = x − x̃ and ε_r = ε / x for x̃ = ±m × b^−k */
function errs(x,m,k,b){const B=BigInt(b),s=x.neg?-1n:1n;
  const R=k>=0?{n:x.N*B**BigInt(k)-m*x.D,d:x.D*B**BigInt(k)}:{n:x.N-m*B**BigInt(-k)*x.D,d:x.D};
  return{zero:R.n===0n,e:ratio(s*R.n,R.d),er:ratio(R.n*x.D,R.d*x.N)};}
/* m × 10^−k as a decimal string */
function decStr(m,k,neg){let s;
  if(k<=0)s=m===0n?'0':(m*BP(10,-k)).toString();else{const t=m.toString().padStart(k+1,'0');s=t.slice(0,-k)+'.'+t.slice(-k);}
  return (neg&&m!==0n?'−':'')+s;}
/* m × b^−k written in base b */
function digStr(m,k,b,neg){let s;const t=m.toString(b);
  if(k<=0)s=m===0n?'0':t+'0'.repeat(-k);else{const p=t.padStart(k+1,'0');s=p.slice(0,-k)+'.'+p.slice(-k);}
  return (neg&&m!==0n?'−':'')+s;}
/* cut a decimal string after maxSig significant digits (only after the point) */
function cutSig(str,maxSig){let cnt=0,seen=false,pt=false;
  for(let i=0;i<str.length;i++){const ch=str[i];if(ch==='.'){pt=true;continue;}if(!/\d/.test(ch))continue;
    if(ch!=='0')seen=true;if(seen)cnt++;if(cnt===maxSig&&pt&&i<str.length-1)return str.slice(0,i+1)+'…';}
  return str;}
/* decimal value of m × 2^−k (exact; it always terminates) */
function binDec(m,k,neg,maxSig){let s;
  if(k<=0)s=(m*BP(2,-k)).toString();else{s=decStr(m*BP(5,k),k,false);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');}
  return (neg&&m!==0n?'−':'')+cutSig(s,maxSig||20);}
/* digits of |x| in base b: integer part and up to nFrac fractional digits */
function expand(x,b,nFrac){const B=BigInt(b);const ip=(x.N/x.D).toString(b);let r=x.N%x.D,fr='';
  for(let i=0;i<nFrac&&r!==0n;i++){r*=B;fr+=(r/x.D).toString(b);r%=x.D;}return{ip,fr,more:r!==0n};}
/* decimal expansion of x for display */
function showX(x,maxSig){const e=expand(x,10,70);let s=e.ip+(e.fr?'.'+e.fr:'');s=cutSig(s,maxSig||24);if(e.more&&!s.endsWith('…'))s+='…';return (x.neg?'−':'')+s;}

/* ---------- small helpers ---------- */
const sg=s=>String(s).replace(/-/g,'−');
const powH=(b,e)=>e===0?'1':e===1?String(b):`${b}<sup>${sg(e)}</sup>`;
const powS=(b,e)=>`${b}<tspan dy="-0.5em" font-size="72%">${e}</tspan>`;
const tw=(t,fs)=>String(t).replace(/<[^>]+>/g,'').length*fs*0.56;
const thin=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const sciA=(v,s)=>v===0?'0':sci(v,s||3);
/* |error| values: whole numbers with thin spaces from 1000 up */
const errA=v=>Math.abs(v)>=1000?thin(Math.round(v)):sciA(v);
function post(){if(window.parent!==window)try{window.parent.postMessage({type:'module-demo-resize'},location.origin);}catch(e){}}
/* filled rectangle from data x = xa to xb, with pixel half-height hh around data y */
function rectX(p,xa,xb,y,hh,fill,op,stroke,layer){const a=p.X(Math.min(xa,xb)),b=p.X(Math.max(xa,xb)),Y=p.Y(y);
  p.L[layer||'under'].push(`<rect x="${a}" y="${Y-hh}" width="${Math.max(0,b-a)}" height="${2*hh}" fill="${fill}" fill-opacity="${op}"${stroke?` stroke="${stroke}" stroke-width="2"`:''}/>`);}
/* labels beside the end of lines; overlapping ones move apart vertically (as in the Class 3 demo) */
function stackLabels(p,labels,w){const gap=p.fs+5,lo=p.m.t+p.fs+2,hi=p.m.t+p.ph-6,placed=[];
  labels.forEach(L=>{L.right=L.X>p.m.l+p.pw-w;L.X=L.right?L.X-12:L.X+12;L.Y=Math.max(lo,Math.min(hi,L.Y+p.fs*0.35));});
  labels.sort((u,v)=>u.Y-v.Y);
  const clash=(L,Y)=>placed.some(q=>Math.abs(q.Y-Y)<gap&&Math.abs((q.right?q.X-w:q.X)-(L.right?L.X-w:L.X))<w);
  for(const L of labels){let Y=L.Y;while(clash(L,Y)&&Y<=hi)Y+=gap;
    if(Y>hi){Y=L.Y;while(clash(L,Y)&&Y>=lo)Y-=gap;}
    L.Y=Math.max(lo,Math.min(hi,Y));placed.push(L);
    p.ptext(L.X,L.Y,L.t,{anchor:L.right?'end':'start',c:L.c,weight:800});}}
const narrow=()=>($('plot').parentElement.clientWidth||700)<600;

const plot=new Plot($('plot')),plot2=new Plot($('plot2'));
const view={xr:null,yr:null},panOpts={lockY:true};
let PART='round';

/* =====================================================================================
   Part 1: rounding and chopping on a grid
   ===================================================================================== */
const PI40='3.141592653589793238462643383279502884197';
const PRE_A=[
 {id:'tie',v:'1.3475',b:10,mode:'dp',n0:1,n1:4,label:'1.3475, 1 to 4 decimal places (a tie at 3)'},
 {id:'tie2',v:'1.3465',b:10,mode:'dp',n0:1,n1:4,label:'1.3465, 1 to 4 decimal places (a tie at 3; 6 is even)'},
 {id:'1.3477',v:'1.3477',b:10,mode:'dp',n0:1,n1:4,label:'1.3477, 1 to 4 decimal places'},
 {id:'23',v:'2/3',b:10,mode:'sig',n0:1,n1:12,label:'2/3, 1 to 12 significant digits'},
 {id:'pi',v:PI40,b:10,mode:'sig',n0:1,n1:15,label:'π, 1 to 15 significant digits'},
 {id:'82',v:'82.31',b:10,mode:'sig',n0:1,n1:5,label:'82.31, 1 to 5 significant digits'},
 {id:'01',v:'0.1',b:2,mode:'sig',n0:1,n1:30,label:'0.1 in binary, 1 to 30 significant bits (single precision: 24)'},
 {id:'patriot',v:'0.1',b:2,mode:'dp',n0:1,n1:30,label:'0.1 in binary, 1 to 30 bits after the point (Patriot: 23, chopped)'},
 {id:'03',v:'0.3',b:2,mode:'sig',n0:1,n1:16,label:'0.3 in binary, 1 to 16 significant bits (notes: 6 and 11)'},
 {id:'custom',label:'Custom: type a number'}];
const NAMES={10:{dp:['decimal place','decimal places'],sig:['significant digit','significant digits']},
             2:{dp:['bit after the binary point','bits after the binary point'],sig:['significant bit','significant bits']}};
let A=null;
function computeA(){
  const bad=s=>({error:s});let x;
  try{x=parseX($('num').value);}catch(e){return bad(e.message);}
  if(x.N===0n)return bad('Use a non-zero number.');
  const b=+$('base').value,sig=$('mode').value==='sig',n0=Math.round(num('n0')),n1=Math.round(num('n1'));
  if(!isFinite(n0)||!isFinite(n1))return bad('Enter whole numbers for n.');
  if(sig&&n0<1)return bad('Keep at least 1 significant '+(b===2?'bit':'digit')+'.');
  if(n0<0)return bad('n must be 0 or more.');
  if(n1<n0)return bad('“n to” must be at least “n from”.');
  if(n1>60)return bad('Use n ≤ 60.');
  const E=Eb(x,b),rows=[];
  for(let n=n0;n<=n1;n++){const k=sig?n-1-E:n,q=quant(x,k,b);rows.push({n,k,q,R:errs(x,q.rr,k,b),C:errs(x,q.t,k,b)});}
  return{x,b,sig,n0,n1,E,rows,one10:x.N===1n&&x.D===10n&&!x.neg};}
/* x with the kept digits in bold and the discarded ones in grey */
function xDigits(k){const x=A.x,b=A.b,e=expand(x,b,Math.max(k,0)+(b===2?10:6));let kept,disc;
  if(k>=0){kept=e.ip+(k>0&&e.fr?'.'+e.fr.slice(0,k):'');disc=(k===0&&e.fr?'.':'')+e.fr.slice(k);}
  else{const c=e.ip.length+k;kept=e.ip.slice(0,c);disc=e.ip.slice(c)+(e.fr?'.'+e.fr:'');}
  if(e.more)disc+='…';
  return `<span class="xdig">${x.neg?'−':''}<b>${kept}</b><span class="disc">${disc}</span>${b===2?'<sub>2</sub>':''}</span>`;}
const valB=(m,k,neg)=>digStr(m,k,A.b,neg);
/* table: decimal values (binary strings are in the formula panel and on the number line) */
const valT=(m,k,neg)=>A.b===10?digStr(m,k,10,neg):binDec(m,k,neg,12);
const valFull=(m,k,neg)=>A.b===10?digStr(m,k,10,neg):digStr(m,k,2,neg)+'<sub>2</sub> = '+binDec(m,k,neg,18);

function drawLine(R){
  const p=plot,small=narrow(),H=small?300:330,b=A.b,Q=R.q,s=A.x.neg?-1:1;
  const uX=s*Q.f,uR=s*Number(Q.rr-Q.t),uH=s*0.5;
  const xr=view.xr||[uH-2.1,uH+2.1];
  p.begin(xr,[0,1],{h:H,ml:12});
  const fs=p.fs,yA=0.25,yC=0.5,yR=0.72,yT=0.9,bh=small?8:9;
  const pxu=p.pw/(xr[1]-xr[0]),i0=Math.ceil(xr[0]-1e-9),i1=Math.floor(xr[1]+1e-9);
  /* number line, the finer grid of the next digit, and the values that can be stored at this precision */
  p.seg(xr[0],yA,xr[1],yA,{c:COL.navy,w:2.5},'under');
  if(pxu/b>=7&&(i1-i0)*b<4000)for(let i=Math.floor(xr[0]*b);i<=Math.ceil(xr[1]*b);i++){if(i%b===0)continue;const u=i/b;p.seg(u,yA-0.025,u,yA+0.025,{c:COL.grey,w:1.5},'under');}
  const gridOK=pxu>=4&&i1-i0<3000;
  if(gridOK)for(let i=i0;i<=i1;i++)p.seg(i,yA-0.06,i,yA+0.06,{c:COL.navy,w:3},'under');
  /* tick labels: the value of each grid point, shortened from the left when space is short */
  if(gridOK){const lab=i=>{const m=(A.x.neg?-Q.t:Q.t)+BigInt(i);return valB(babs(m),Q.k,m<0n);};
    const wFull=tw(lab(0),fs-1)+16;let step=1,maxc=Infinity;
    if(pxu<wFull){if(pxu>=72)maxc=Math.max(4,Math.floor((pxu-16)/((fs-1)*0.56)));else{for(const st of [2,5,10,20,50,100,200,500,1000,2000,5000]){step=st;if(st*pxu>=wFull)break;}}}
    for(let i=i0;i<=i1;i++){if(i%step!==0)continue;let t=lab(i);if(t.length>maxc)t='…'+t.slice(-(maxc-1));
      const Xp=p.X(i),hw=tw(t,fs-1)/2;if(Xp-hw<0||Xp+hw>p.W)continue;
      p.L.front.push(`<text x="${Xp}" y="${p.Y(yA)+fs+10}" fill="${COL.navy}" font-size="${fs-1}" text-anchor="middle" font-weight="${i===0||i===s?700:500}">${t}</text>`);}}
  /* half-way point between the two neighbouring grid values */
  if(!Q.exact){p.seg(uH,yA-0.07,uH,yC+0.07,{c:COL.grey,w:2,dash:'5 5'},'mid');
    const Xh=p.X(uH);if(Xh>p.m.l+30&&Xh<p.m.l+p.pw-30)p.ptext(Xh,p.Y(yA)+2*fs+16,'half-way',{c:COL.grey,weight:700,size:fs-2});}
  /* bands: every number in a band gives the same chopped / rounded value */
  rectX(p,0,s,yC,bh,COL.curve,0.2,COL.curve);
  rectX(p,uR-0.5,uR+0.5,yR,bh,COL.orange,0.2,COL.orange);
  /* drop lines from the stored values to the grid */
  p.seg(0,yC,0,yA,{c:COL.curve,w:1.8,dash:'2 5'},'under');
  p.seg(uR,yR,uR,yA,{c:COL.orange,w:1.8,dash:'2 5'},'under');
  /* the errors ε = x − x̃ */
  p.seg(0,yC,uX,yC,{c:COL.curve,w:5},'mid');p.seg(uR,yR,uX,yR,{c:COL.orange,w:5},'mid');
  /* x */
  p.seg(uX,yA,uX,yT-0.06,{c:COL.teal,w:3},'top');p.dot(uX,yA,6,COL.teal,'top');
  p.ring(0,yC,8,COL.curve);p.dot(uR,yR,7.5,COL.orange,'top');
  const Xx=p.X(uX);if(Xx>=p.m.l-2&&Xx<=p.m.l+p.pw+2)p.ptext(Xx,p.Y(yT)+4,'x',{c:COL.teal,weight:800,size:fs+2});
  /* labels beside the bands (never on them) */
  const bandLabel=(a,c,y,t1,t2,col)=>{const Xa=p.X(Math.min(a,c)),Xb=p.X(Math.max(a,c)),w=Math.max(tw(t1,fs),tw(t2,fs-2))+4,lo=p.m.l+2,hi=p.m.l+p.pw-2,Y=p.Y(y);
    let X,an;if(Xa-14-w>=lo){X=Xa-14;an='end';}else if(Xb+14+w<=hi){X=Xb+14;an='start';}else{X=lo+2;an='start';}

  const rows=[{t:`${P0.nx}: δ${P0.nx} / |${P0.nx}|`,v:b.rx,c:COL.curve,on:true},{t:`${P0.ny}: δ${P0.ny} / |${P0.ny}|`,v:b.ry,c:COL.curve,on:k>=1},
    {t:`${P0.nf}: worst-case bound δf / |f|`,v:b.rf,c:COL.orange,on:k>=2},{t:`${P0.nf}: true extremes`,v:b.rt,c:COL.teal,on:k>=3}];
  const vmax=Math.max(...rows.map(r=>isFinite(r.v)?r.v:0))||1,valW=small?80:110;
  const W=Math.max(260,p.svg.parentElement.clientWidth||600),pw=W-12-(small?12:22);
  p.begin([0,vmax*pw/Math.max(40,pw-valW)],[0,4.3],{h:H,ml:12});
  const fs=p.fs,uy=4.3/p.ph,yA=0.3;
  p.seg(0,yA,p.xr[1],yA,{c:COL.navy,w:2},'under');
  for(const t of ticks(0,p.xr[1],Math.max(3,Math.round(p.pw/(small?85:110))))){if(t<0)continue;p.seg(t,yA-5*uy,t,yA+5*uy,{c:COL.navy,w:2},'under');
    const lab=sg(fmt(100*t,3))+' %',X=p.X(t),hw=tw(lab,fs-2)/2;if(X+hw<=p.W&&X-hw>=0)p.L.front.push(`<text x="${X}" y="${p.Y(yA)+fs+8}" fill="${COL.navy}" font-size="${fs-2}" text-anchor="middle">${lab}</text>`);}
  rows.forEach((r,i)=>{if(!r.on)return;const y=3.65-i*0.9,v=isFinite(r.v)?r.v:p.xr[1],tc=r.c===COL.curve?COL.navy:r.c;
    rectX(p,0,v,y,7,r.c,0.85,null,'mid');
    p.ptext(p.m.l+4,p.Y(y)-16,r.t,{anchor:'start',c:tc,weight:700,size:fs-2});
    p.ptext(p.X(v)+8,p.Y(y)+fs*0.35,pc(r.v),{anchor:'start',c:tc,weight:750,size:fs-2});});
  p.end();}
function renderProp(k){
  if(!Cst||Cst.error){emptyPlots();setFormula('');setStatus('bad',Cst?Cst.error:'');renderTable('tbl',[],[],-1);return;}
  drawProp(k);drawRelBars(k);const b=Cst,P0=PC,o=OPS[b.op];
  const iv=(c,d)=>`[${F7(c-d)}, ${F7(c+d)}]`;
  let l1,l2,l3;
  if(k===0){l1=`x: ${P0.nx} = ${F7(b.x)} ± ${F7(b.dx)} ${P0.ux}`;l2=`${P0.nx} lies somewhere in ${iv(b.x,b.dx)}, an interval of width 2δx.`;l3=`Relative error δx/|x| = ${R3(b.rx)} = ${F3(100*b.rx)} %`;}
  else if(k===1){l1=`y: ${P0.ny} = ${F7(b.y)} ± ${F7(b.dy)} ${P0.uy}`;l2=`${P0.ny} lies somewhere in ${iv(b.y,b.dy)}; δy/|y| = ${R3(b.ry)}.`;l3=`Worst case: the two errors combine to give the largest possible error.`;}
  else{l1=`f = ${P0.nf==='f'?'x '+o+' y':P0.nf} = ${F7(b.x)} ${o} ${F7(b.y)} = <b>${F7(b.f)}</b> ${P0.uf}`;
    if(!b.rel)l2=`δf = δx + δy = ${F7(b.dx)} + ${F7(b.dy)} = <b>${F3(b.df)}</b> ${P0.uf}`;
    else l2=`δf/|f| = δx/|x| + δy/|y| = ${R3(b.rx)} + ${R3(b.ry)} = <b>${R3(b.rf)}</b>`;
    l3=(b.rel?`δf = ${R3(b.rf)} × ${F7(Math.abs(b.f))} = ${F3(b.df)} ${P0.uf}, so `:'')+`<span class="k-r">${P0.nf} = ${F7(b.f)} ± ${F3(b.df)} ${P0.uf}</span>`;}
  setFormula(`<span class="line1">${l1}</span><span class="line2">${l2}</span><span class="line3">${l3}</span>`);
  const cancel=!b.rel&&isFinite(b.rf)&&b.rf>10*Math.max(b.rx,b.ry);
  if(k<2)setStatus('info',`Step ${k} of 3. Press Step (&rarr;) to ${k===0?'add the second value':'combine the errors'}.`);
  else if(k===2)setStatus(cancel?'bad':'ok',`Worst case: ${b.rel?'relative errors add':'absolute errors add'}. ${P0.nf} = ${F7(b.f)} ± ${F3(b.df)} ${P0.uf}.`+
    (cancel?` Cancellation: the absolute error is small, but so is the difference, so its relative error (${fmt(100*b.rf,3)} %) is far larger than that of either input.`:''));
  else{const best=b.corners.reduce((a,q)=>Math.abs(q.v-b.f)>Math.abs(a.v-b.f)+1e-12?q:a);
    const cs=q=>`${P0.nx} ${q.sx>0?'+':'−'} δ${P0.nx}, ${P0.ny} ${q.sy>0?'+':'−'} δ${P0.ny}`;
    if(!b.rel)setStatus('ok',`The 4 corners give ${P0.nf} ∈ [${F7(b.lo)}, ${F7(b.hi)}], exactly f ± δf: for + and − the worst-case bound is reached (for example at ${cs(best)}).`);
    else setStatus('info',`The 4 corners give ${P0.nf} ∈ [${F7(b.lo)}, ${F7(b.hi)}], from f − ${fmt(b.f-b.lo,4)} to f + ${fmt(b.hi-b.f,4)}. The bound δf = ${fmt(b.df,4)} is first order: it drops the δx·δy term, so for × and ÷ it is approximate.`);}
  const rowsT=[[P0.nx,F7(b.x),F7(b.dx),R3(b.rx),iv(b.x,b.dx)]];
  if(k>=1)rowsT.push([P0.ny,F7(b.y),F7(b.dy),R3(b.ry),iv(b.y,b.dy)]);
  if(k>=2)rowsT.push([P0.nf+' (worst case)',F7(b.f),F3(b.df),isFinite(b.rf)?R3(b.rf):'—',iv(b.f,b.df)]);
  if(k>=3){for(const q of b.corners)rowsT.push([`corner ${P0.nx} ${q.sx>0?'+':'−'} δ${P0.nx}, ${P0.ny} ${q.sy>0?'+':'−'} δ${P0.ny}`,F7(q.v),OFF(+(q.v-b.f).toPrecision(10)),'','']);
    rowsT.push([P0.nf+' (true extremes)',F7(b.f),'−'+F3(+(b.f-b.lo).toPrecision(10))+', +'+F3(+(b.hi-b.f).toPrecision(10)),isFinite(b.rt)?R3(b.rt):'—',`[${F7(b.lo)}, ${F7(b.hi)}]`]);}
  renderTable('tbl',['quantity','value','δ (offset)','δ / |value|','interval'],rowsT,Math.min(k,2)===k?k:rowsT.length-1);
  $('tbl').querySelectorAll('td:first-child').forEach(td=>td.classList.add('lft'));}

/* =====================================================================================
   Wiring
   ===================================================================================== */
function emptyPlots(){plot.begin([0,1],[0,1],{h:200,ml:12});plot.end();plot2.begin([0,1],[0,1],{h:120,ml:12});plot2.end();}
function render(k){if(PART==='round')renderRound(k);else if(PART==='accum')renderAccum(k);else renderProp(k);post();}
const S=Stepper(render);S.delay=1100;
/* in Part 1 every step changes the unit of the number line, so the view resets */
const set0=S.set;S.set=k=>{if(PART==='round'&&k!==S.k){view.xr=null;view.yr=null;}set0(k);};
function restart(){view.xr=view.yr=null;S.pause();set0(0);}
function recomputeA(){A=computeA();$('errA').textContent=A.error||'';S.last=A.error?0:A.rows.length-1;restart();}
function recomputeB(){Bst=computeB();$('errB').textContent=Bst.error||'';S.last=Bst.error?0:Bst.steps.length-1;restart();}
function recomputeC(){Cst=readC();$('errC').textContent=Cst.error||'';S.last=3;restart();}
function keepLabels(){const b=+$('base').value,v=$('mode').value;
  $('mode').innerHTML=`<option value="dp">${b===10?'decimal places':'bits after the point'}</option><option value="sig">${b===10?'significant digits':'significant bits'}</option>`;$('mode').value=v;}
const LEDE={round:'Chopping keeps the first n digits and discards the rest; rounding goes to the nearest value on the grid, and a tie goes to the even digit. Each step keeps one more digit, so the grid becomes 10 (or 2) times finer.',
  accum:'A constant c is stored with a small error and then added N times. The error of the running sum grows with N. Each step multiplies N by 10.',
  prop:'Worst case: the errors combine to give the largest possible error. Absolute errors add for + and −; relative errors add for × and ÷. Each step adds one piece.'};
const HINT={round:'Every row rounds or chops the original x. Large ticks: the values that can be stored with n digits; small ticks: the next digit. 1 unit = the spacing of the large ticks.',
  accum:'Solid: |error| of the running sum against the exact sum N·c. Dashed: N × (error in storing c), the growth if only the stored c were wrong.',
  prop:'Bars are drawn to scale as offsets from the central value: absolute for + and −, relative (%) for × and ÷.'};
const TITLE={round:'Number line around x',accum:'|Error of the running sum| against N (log–log)',prop:'Intervals of the inputs and of the result'};
function setLegend(){
  const sw=(c,cls)=>`<i class="${cls||''}" style="border-color:${c};${cls?'':'background:'+c+'33'}"></i>`;
  if(PART==='round'){$('legend').innerHTML=`<span>${sw(COL.teal,'ln')}x</span><span>${sw(COL.curve)}chopped: every number in the band chops to the same value</span><span>${sw(COL.orange)}rounded: every number in the band rounds to the same value</span><span>${sw(COL.grey,'dl')}half-way</span><span>solid segment: the error ε = x − x̃</span>`;
    const sig=$('mode').value==='sig';
    $('plot2Title').innerHTML=(sig?'Relative error |ε<sub>r</sub>|':'Absolute error |ε|')+' against n (log scale), with the error bounds';
    $('legend2').innerHTML=`<span>${sw(COL.orange,'ln')}rounding</span><span>${sw(COL.curve,'ln')}chopping</span><span>${sw(COL.grey,'dl')}bounds</span><span>no point: error 0 (x stored exactly)</span>`;}
  else if(PART==='accum'){$('legend').innerHTML=`<span>${sw(COL.curve,'ln')}single precision (Math.fround)</span><span>${sw(COL.teal,'ln')}double precision</span><span>${sw(COL.orange,'ln')}24-bit register, c chopped after 23 bits (Patriot)</span><span>${sw(COL.grey,'dl')}N × (error in storing c)</span>`;}
  else{$('legend').innerHTML=`<span>${sw(COL.curve,'ln')}inputs x ± δx, y ± δy</span><span>${sw(COL.orange,'ln')}worst-case bound f ± δf</span><span>${sw(COL.teal,'ln')}true extremes over the 4 corners</span><span>• central value</span>`;
    $('plot2Title').textContent='Relative errors';$('legend2').innerHTML='';}}
function setPart(){PART=$('part').value;
  $('grpA').hidden=PART!=='round';$('grpB').hidden=PART!=='accum';$('grpC').hidden=PART!=='prop';$('plot2Box').hidden=PART==='accum';
  $('lede').textContent=LEDE[PART];$('partHint').textContent=HINT[PART];$('plotTitle').textContent=TITLE[PART];
  $('plot').setAttribute('aria-label',TITLE[PART]);panOpts.lockY=PART!=='accum';S.delay=PART==='prop'?1300:1100;
  try{history.replaceState(null,'','#'+PART);}catch(e){}
  setLegend();if(PART==='round')recomputeA();else if(PART==='accum')recomputeB();else recomputeC();}

/* Part 1 controls */
fillSelect('presetA',PRE_A);
function applyA(){const P0=PRE_A.find(q=>q.id===$('presetA').value);if(!P0.v){$('num').focus();return;}
  $('num').value=P0.v;$('base').value=String(P0.b);keepLabels();$('mode').value=P0.mode;$('n0').value=P0.n0;$('n1').value=P0.n1;setLegend();recomputeA();}
onSelectChange('presetA',applyA);
$('num').addEventListener('input',debounce(()=>{$('presetA').value='custom';recomputeA();},300));
$('num').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
onSelectChange('base',()=>{$('presetA').value='custom';keepLabels();recomputeA();});
onSelectChange('mode',()=>{$('presetA').value='custom';if($('mode').value==='sig'&&num('n0')<1)$('n0').value=1;setLegend();recomputeA();});
for(const id of ['n0','n1'])onNumber(id,debounce(()=>{$('presetA').value='custom';recomputeA();},300));
/* Part 2 controls */
fillSelect('presetB',PRE_B);$('nmax').innerHTML=NMAX.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
function applyB(){const P0=PRE_B.find(q=>q.id===$('presetB').value);if(!P0.c){$('cval').focus();return;}$('cval').value=P0.c;$('nmax').value=String(P0.nmax);recomputeB();}
onSelectChange('presetB',applyB);
$('cval').addEventListener('input',debounce(()=>{$('presetB').value='custom';recomputeB();},400));
$('cval').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
onSelectChange('nmax',recomputeB);
/* Part 3 controls */
fillSelect('presetC',PRE_C);
function applyC(P0){PC=P0;$('vx').value=P0.x;$('dx').value=P0.dx;$('vy').value=P0.y;$('dy').value=P0.dy;$('op').value=P0.op;recomputeC();}
function customC(){PC={id:'custom',nx:'x',ny:'y',nf:'f',ux:'',uy:'',uf:''};$('presetC').value='custom';recomputeC();}
onSelectChange('presetC',()=>{const P0=PRE_C.find(q=>q.id===$('presetC').value);if(P0.id==='custom'){customC();return;}applyC(P0);});
for(const id of ['vx','dx','vy','dy'])onNumber(id,debounce(customC,300));
onSelectChange('op',customC);

onSelectChange('part',setPart);
enablePanZoom(plot,view,()=>S.show(),panOpts);
bindViewControls([view],()=>S.show());
onThemeChange(setLegend);
/* start: the part can be chosen with the URL hash (#round, #accum, #prop) */
(function(){const h=(location.hash||'').slice(1);$('part').value=['round','accum','prop'].includes(h)?h:'round';
  const pa=PRE_A[0];$('presetA').value=pa.id;$('num').value=pa.v;$('base').value='10';keepLabels();$('mode').value=pa.mode;$('n0').value=pa.n0;$('n1').value=pa.n1;
  $('presetB').value=PRE_B[0].id;$('cval').value=PRE_B[0].c;$('nmax').value=String(PRE_B[0].nmax);
  PC=PRE_C[0];$('presetC').value=PC.id;$('vx').value=PC.x;$('dx').value=PC.dx;$('vy').value=PC.y;$('dy').value=PC.dy;$('op').value=PC.op;
  setPart();})();
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['round','accum','prop'].includes(h)&&h!==PART){$('part').value=h;setPart();}});
</script>
