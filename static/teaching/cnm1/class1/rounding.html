<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../theme.js"></script>
<title>Rounding and Errors</title>
<link rel="stylesheet" href="../demo.css">
<style>
@font-face{font-family:"CMU Sans Serif";src:url("fonts/cmunss.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"CMU Sans Serif";src:url("fonts/cmunsx.woff2") format("woff2");font-weight:700 900;font-display:swap}
.grp{display:contents}
.grp>.span2{grid-column:span 2}
.grp>.full{grid-column:1/-1}
@media (max-width:600px){.grp>.span2{grid-column:1/-1}}
.k-r{color:var(--orange);font-weight:700}
.k-c{color:var(--curve);font-weight:700}
.k-x{color:var(--teal);font-weight:700}
</style>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>Rounding, chopping and error propagation</h1>
  <p class="lede" id="lede">Chopping discards the extra digits; rounding goes to the nearest candidate, and a tie goes to the even digit. Each step keeps one digit fewer.</p>
</header>
<main class="layout">
  <section class="plotcard">
    <svg class="plot" id="plot" role="img" aria-label="Number line with the candidate values, x, the rounded and the chopped value"></svg>
    <p class="plot-hint" id="plotHint">Drag to pan · scroll to zoom</p>
  </section>
  <aside class="side">
    <label class="field span2">Part<select id="part"><option value="round">Rounding and chopping</option><option value="prop">Error propagation (worst case)</option></select></label>
    <div class="grp" id="grpA">
      <label class="field span2">Preset<select id="presetA"></select></label>
      <label class="field span2">Number x (decimal or p/q)<input id="num" type="text" value="1.3475" spellcheck="false" autocomplete="off"></label>
      <label class="field span2">Keep<select id="mode"><option value="dp">decimal places</option><option value="sig">significant digits</option></select></label>
      <label class="field">n (start)<input id="n" type="number" step="1" min="0" max="30" value="3"></label>
      <div id="numErr" class="err full"></div>
    </div>
    <div class="grp" id="grpB" hidden>
      <label class="field span2">Preset<select id="presetB"></select></label>
      <label class="field span2">Operation f<select id="op"><option value="+">f = x + y</option><option value="-">f = x − y</option><option value="*">f = x × y</option><option value="/">f = x / y</option></select></label>
      <label class="field">x<input id="vx" type="number" step="any" value="82.31"></label>
      <label class="field">δx<input id="dx" type="number" step="any" min="0" value="0.05"></label>
      <label class="field">y<input id="vy" type="number" step="any" value="21.89"></label>
      <label class="field">δy<input id="dy" type="number" step="any" min="0" value="0.02"></label>
      <div id="propErr" class="err full"></div>
    </div>
    <p class="hint" id="partHint"></p>
    <p class="hint">Keys: &rarr; step, &larr; back, p play, r reset</p>
  </aside>
  <div class="controls btns">
    <button id="btnBack" type="button" title="Back (left arrow)">&larr; Back</button>
    <button id="btnStep" type="button" class="primary" title="Step (right arrow)">Step &rarr;</button>
    <button id="btnPlay" type="button" title="Play / pause (p)">Play</button>
    <button id="btnReset" type="button" title="Reset (r)">Reset</button>
    <button id="btnResetView" type="button" title="Restore the original graph view">Reset view</button>
  </div>
  <section class="results-card">
    <div class="formula wrap" id="formula">&nbsp;</div>
    <div class="status" id="status">&nbsp;</div>
    <div class="tablewrap scroll"><table id="tbl"></table></div>
  </section>
</main>
<footer style="margin-top:1rem;color:var(--grey);font-size:.8rem">© Andrea Nóvoa</footer>
</div>
<script src="../demo-core.js"></script>
<script>
"use strict";
/* ---------- exact decimal arithmetic (BigInt): rounding never goes through binary floats ---------- */
const pow10=n=>10n**BigInt(n);
const bitlen=a=>a===0n?0:a.toString(2).length;
const babs=a=>a<0n?-a:a;
function gcd(a,b){a=babs(a);b=babs(b);while(b){const t=a%b;a=b;b=t;}return a||1n;}
function ratio(a,b){if(a===0n)return 0;const neg=a<0n;if(neg)a=-a;
  const sh=bitlen(b)-bitlen(a)+64;const q=sh>=0?(a<<BigInt(sh))/b:a/(b<<BigInt(-sh));
  let v=Number(q),e=-sh;while(e>900){v*=2**900;e-=900;}while(e<-900){v*=2**-900;e+=900;}v*=2**e;return neg?-v:v;}
/* "1.3475", "-2.5e3" or "2/3" -> exact {neg, N, D} */
function parseX(str){
  const s=String(str).trim().replace(/[−–]/g,'-').replace(/[\s,_]+/g,'');
  let m=s.match(/^([+-])?(\d+)\/(\d+)$/);
  if(m){const N=BigInt(m[2]),D=BigInt(m[3]);if(D===0n)throw new Error('The denominator must not be 0.');const g=gcd(N,D);return{neg:m[1]==='-'&&N>0n,N:N/g,D:D/g};}
  m=s.match(/^([+-])?(\d*)(?:\.(\d*))?(?:e([+-]?\d+))?$/i);
  if(!m||(!m[2]&&!m[3]))throw new Error('Type a decimal number such as 1.3475, or a fraction such as 2/3.');
  const ip=m[2]||'',fp=m[3]||'',ex=m[4]?parseInt(m[4],10):0;
  if(Math.abs(ex)>60||(ip+fp).length>60)throw new Error('Use at most 60 digits and |exponent| ≤ 60.');
  let N=BigInt((ip+fp)||'0'),D=pow10(fp.length);if(ex>0)N*=pow10(ex);else if(ex<0)D*=pow10(-ex);
  const g=gcd(N,D);return{neg:m[1]==='-'&&N>0n,N:N/g,D:D/g};}
/* m × 10^−k as a decimal string */
function decStr(m,k,neg){let s;
  if(k<=0)s=(m*pow10(-k)).toString();else{const t=m.toString().padStart(k+1,'0');s=t.slice(0,-k)+'.'+t.slice(-k);}
  return (neg&&m!==0n?'−':'')+s;}
/* exact decimal of n/d if it terminates within maxDig places, else null */
function ratDec(n,d,maxDig){if(n===0n)return '0';const g=gcd(n,d);n/=g;d/=g;let r=d,a=0,b=0;
  while(r%2n===0n){r/=2n;a++;}while(r%5n===0n){r/=5n;b++;}if(r!==1n)return null;const k=Math.max(a,b);if(k>maxDig)return null;
  const m=n*pow10(k)/d;return decStr(babs(m),k,m<0n);}
/* decimal expansion of x, cut at maxSig significant digits (… if longer) */
function showX(x,maxSig){maxSig=maxSig||24;const ex=ratDec(x.N,x.D,80);
  if(ex&&ex.replace(/[^0-9]/g,'').replace(/^0+/,'').length<=maxSig)return (x.neg?'−':'')+ex;
  const e=E10(x),k=Math.max(0,maxSig-1-e),t=x.N*pow10(k)/x.D;return (x.neg?'−':'')+decStr(t,k,false)+'…';}
/* floor(log10 |x|) */
function E10(x){let g=x.N.toString().length-x.D.toString().length;
  const geq=g=>g>=0?x.N>=x.D*pow10(g):x.N*pow10(-g)>=x.D;
  while(!geq(g))g--;while(geq(g+1))g++;return g;}
/* keep k decimal places (k may be negative): chopped magnitude t, rounded magnitude rr (ties to even) */
function quant(x,k){const sn=k>=0?x.N*pow10(k):x.N,sd=k>=0?x.D:x.D*pow10(-k);
  const t=sn/sd,r=sn-t*sd,tie=2n*r===sd,above=2n*r>sd,up=above||(tie&&(t&1n)===1n);
  return{k,t,r,sd,tie,above,exact:r===0n,rr:up?t+1n:t,up,f:ratio(r,sd)};}
/* ε = x − x̃ and ε_r = ε / x for x̃ = ±m × 10^−k (exact fractions) */
function errs(x,m,k){const s=x.neg?-1n:1n;
  const R=k>=0?{n:x.N*pow10(k)-m*x.D,d:x.D*pow10(k)}:{n:x.N-m*pow10(-k)*x.D,d:x.D};
  return{n:s*R.n,d:R.d,e:ratio(s*R.n,R.d),er:x.N===0n?0:ratio(R.n*x.D,R.d*x.N),dec:ratDec(s*R.n,R.d,30)};}
/* sci() with enough digits for numbers of 1 000 and above */
function sciS(v,s){const a=Math.abs(v);return sci(v,a>=1&&a<1e6?Math.max(s||3,Math.floor(Math.log10(a))+1):s);}
const sg=s=>String(s).replace(/-/g,'−');
const eTxt=E=>E.n===0n?'0':(E.dec&&E.dec.replace(/[^0-9]/g,'').replace(/^0+/,'').length<=8?E.dec:sciS(E.e,3));
const erTxt=E=>E.n===0n?'0':sci(E.er,3);

/* ---------- presets ---------- */
const PI40='3.141592653589793238462643383279502884197';
const PRE_A=[
 {id:'1.3472',v:'1.3472',mode:'dp',n:3,label:'1.3472, 3 decimal places'},
 {id:'1.3477',v:'1.3477',mode:'dp',n:3,label:'1.3477, 3 decimal places'},
 {id:'1.3475',v:'1.3475',mode:'dp',n:3,label:'1.3475, 3 decimal places (a tie)'},
 {id:'1.3465',v:'1.3465',mode:'dp',n:3,label:'1.3465, 3 decimal places (a tie)'},
 {id:'pi',v:PI40,mode:'sig',n:10,label:'π (40 digits), 10 significant digits'},
 {id:'23',v:'2/3',mode:'sig',n:10,label:'2/3, 10 significant digits'},
 {id:'82.31',v:'82.31',mode:'sig',n:4,label:'82.31, 4 significant digits'},
 {id:'custom',label:'Custom: type a number'}];
const PRE_B=[
 {id:'sum',label:'m₁ + m₂ (two masses)',x:82.31,dx:0.05,y:21.89,dy:0.02,op:'+',nx:'m₁',ny:'m₂',nf:'m₁ + m₂',ux:'kg',uy:'kg',uf:'kg'},
 {id:'diff',label:'m₁ − m₂ (two masses)',x:82.31,dx:0.05,y:21.89,dy:0.02,op:'-',nx:'m₁',ny:'m₂',nf:'m₁ − m₂',ux:'kg',uy:'kg',uf:'kg'},
 {id:'W',label:'Weight W = m₁ g',x:82.31,dx:0.05,y:9.81,dy:0.01,op:'*',nx:'m₁',ny:'g',nf:'W',ux:'kg',uy:'m/s²',uf:'N'},
 {id:'custom',label:'Custom: type the values'}];
const OPS={'+':'+','-':'−','*':'×','/':'/'};

let PART='round',X=null,XS='',N0=3,PB=PRE_B[0],B=null;
const view={xr:null,yr:null};
const plot=new Plot($('plot'));
const isSig=()=>$('mode').value==='sig';
/* decimal places kept at step k */
function nAt(k){return N0-k;}
function kdp(n){return isSig()?n-1-E10(X):n;}

/* ---------- Part 1: number line around x, in units of the last kept place ---------- */
function lineFrame(p,xr,labFn,small){const m=p.m,Bk=p.L.back,fs=p.fs;
  Bk.push(`<rect x="${m.l}" y="${m.t}" width="${p.pw}" height="${p.ph}" fill="none" stroke="${COL.grey}" stroke-width="1.5"/>`);
  return {tick:(u,lab)=>{const Xp=p.X(u);if(Xp<m.l-0.5||Xp>m.l+p.pw+0.5)return;
    Bk.push(`<line x1="${Xp}" y1="${m.t+p.ph}" x2="${Xp}" y2="${m.t+p.ph-6}" stroke="${COL.grey}" stroke-width="1.5"/>`);
    const hw=String(lab==null?'':lab).replace(/<[^>]+>/g,'').length*fs*0.29+2;
    if(lab!=null&&Xp-hw>=0&&Xp+hw<=p.W)Bk.push(`<text x="${Xp}" y="${m.t+p.ph+fs+8}" fill="${COL.navy}" font-size="${fs-1}" text-anchor="middle">${lab}</text>`);}};}
function drawRound(n){
  const p=plot,small=($('plot').parentElement.clientWidth||700)<600,H=small?200:240;
  const k=kdp(n),Q=quant(X,k),sgn=X.neg?-1:1,f=Q.f;
  const uC=-sgn*f,uR=sgn*Number(Q.rr-Q.t)-sgn*f,uH=sgn*(0.5-f);
  const xr=view.xr||[uH-1.75,uH+1.75];
  p.begin(xr,[0,1],{h:H,ml:16});const fr=lineFrame(p,xr,null,small);
  /* candidate values: every multiple of the last kept place */
  const pxu=p.pw/(xr[1]-xr[0]),i0=Math.ceil(xr[0]+sgn*f),i1=Math.floor(xr[1]+sgn*f);
  const lab=i=>{const m=(X.neg?-Q.t:Q.t)+BigInt(i);return decStr(babs(m),k,m<0n);};
  const wLab=(lab(0).length+1)*p.fs*0.55+18;let step=1;for(const s of [1,2,5,10,20,50,100,200,500,1000,2000,5000,1e4,2e4,5e4,1e5]){step=s;if(s*pxu>=wLab)break;}
  if(pxu>=3&&i1-i0<4000){for(let i=i0;i<=i1;i++){const u=i-sgn*f;p.seg(u,0.38,u,0.62,{c:COL.grey,w:2});
      const m=(X.neg?-Q.t:Q.t)+BigInt(i);fr.tick(u,(m%BigInt(step)===0n)?lab(i):null);}}
  else p.band(xr[0],xr[1],COL.grey,0.12);
  p.seg(xr[0],0.5,xr[1],0.5,{c:COL.navy,w:2},'under');
  if(!Q.exact)p.seg(uH,0.3,uH,0.7,{c:COL.grey,w:2,dash:'5 5'});
  p.ring(uC,0.5,10,COL.curve);p.dot(uR,0.5,6.5,COL.orange,'top',COL.orange);
  p.seg(0,0.27,0,0.73,{c:COL.teal,w:3.5},'top');
  /* labels above the line, spread so they never overlap; the half-way label below */
  const same=Q.rr===Q.t,L=[[p.X(0),'x',COL.teal]];
  if(same)L.push([p.X(uR),Q.exact?'rounded = chopped = x':'rounded = chopped',COL.orange]);else{L.push([p.X(uR),'rounded',COL.orange]);L.push([p.X(uC),'chopped',COL.curve]);}
  if(Q.exact)L.splice(0,1);
  L.sort((a,b)=>a[0]-b[0]);const XS2=spread(L.map(l=>l[0]),small?86:104,p.m.l+44,p.m.l+p.pw-44);
  L.forEach((l,i)=>p.ptext(XS2[i],p.Y(0.84),l[1],{c:l[2],weight:800}));
  if(!Q.exact){const Xh=Math.max(p.m.l+40,Math.min(p.m.l+p.pw-40,p.X(uH)));p.ptext(Xh,p.Y(0.13),'half-way',{c:COL.grey,weight:700,size:p.fs-2});}
  p.end();return Q;}

function renderRound(k){
  if(!X){plot.begin([0,1],[0,1],{h:200,ml:16});plot.end();setFormula('');setStatus('bad',$('numErr').textContent);renderTable('tbl',[],[],-1);return;}
  const n=nAt(k),Q=drawRound(n),unit=isSig()?'significant digit':'decimal place',neg=X.neg;
  const rS=decStr(Q.rr,Q.k,neg),cS=decStr(Q.t,Q.k,neg),Er=errs(X,Q.rr,Q.k),Ec=errs(X,Q.t,Q.k);
  const last=Q.k>0?'10<sup>−'+Q.k+'</sup>':Q.k===0?'1':'10<sup>'+(-Q.k)+'</sup>';
  setFormula(`<span class="line1">x = <span class="k-x">${XS}</span>, keep n = <b>${n}</b> ${unit}${n===1?'':'s'} (last place ${last})</span>`+
    `<span class="line2"><span class="k-r">rounded</span> x̃ = <b>${rS}</b>: &nbsp;ε = x − x̃ = ${eTxt(Er)}, &nbsp;ε<sub>r</sub> = ${erTxt(Er)}</span>`+
    `<span class="line3"><span class="k-c">chopped</span> x̃ = <b>${cS}</b>: &nbsp;ε = ${eTxt(Ec)}, &nbsp;ε<sub>r</sub> = ${erTxt(Ec)}</span>`);
  let why;
  if(Q.exact)why=`Nothing is discarded: x already has at most ${n} ${unit}s.`;
  else if(Q.tie)why=`The discarded part is exactly half the last place: a tie, so round to the even digit (${Q.up?'up':'down'} to ${rS}).`;
  else why=`The discarded part is ${Q.above?'more':'less'} than half the last place: round ${Q.above?'up':'down'}. Chopping always goes towards zero.`;
  setStatus(Q.exact?'ok':'info',why);
  const head=['n','rounded','chopped','|ε| rounded','|ε<sub>r</sub>| rounded','|ε| chopped','|ε<sub>r</sub>| chopped'];
  const rows=[];for(let j=0;j<=k;j++){const nn=nAt(j),q=quant(X,kdp(nn)),a=errs(X,q.rr,q.k),b=errs(X,q.t,q.k);
    const ab=E=>({...E,n:babs(E.n),e:Math.abs(E.e),er:Math.abs(E.er),dec:E.dec?E.dec.replace('−',''):null});
    rows.push([nn,decStr(q.rr,q.k,neg),decStr(q.t,q.k,neg),eTxt(ab(a)),erTxt(ab(a)),eTxt(ab(b)),erTxt(ab(b))]);}
  renderTable('tbl',head,rows,k);}

/* ---------- Part 2: worst-case propagation, drawn to scale ---------- */
function readB(){const x=num('vx'),dx=num('dx'),y=num('vy'),dy=num('dy'),op=$('op').value;
  if(![x,dx,y,dy].every(isFinite))return{error:'Enter numbers for x, δx, y and δy.'};
  if(dx<0||dy<0)return{error:'δx and δy are error bounds: use values ≥ 0.'};
  const rel=op==='*'||op==='/';
  if(rel&&(x===0||y===0))return{error:'Relative errors need x ≠ 0 and y ≠ 0.'};
  if(op==='/'&&Math.abs(y)<=dy)return{error:'The interval of y contains 0: x / y is unbounded.'};
  const f=op==='+'?x+y:op==='-'?x-y:op==='*'?x*y:x/y;
  const ends=[];for(const a of [x-dx,x+dx])for(const b of [y-dy,y+dy])ends.push(op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b);
  const rx=dx/Math.abs(x),ry=dy/Math.abs(y),df=rel?Math.abs(f)*(rx+ry):dx+dy;
  return{x,dx,y,dy,op,f,df,rel,rx,ry,rf:f!==0?df/Math.abs(f):Infinity,lo:Math.min(...ends),hi:Math.max(...ends)};}
const F7=v=>fmt(v,7),F3=v=>fmt(v,3);
function drawProp(k){
  const p=plot,small=($('plot').parentElement.clientWidth||700)<600,H=small?260:300,b=B;
  /* ± : absolute offsets (same units for every row); × ÷ : relative offsets */
  const sc=(v,c)=>b.rel?v/Math.abs(c):v;
  const rows=[{y:2.5,h:sc(b.dx,b.x),c:COL.curve,t:`${PB.nx} = ${F7(b.x)} ± ${F7(b.dx)} ${PB.ux}`,on:true},
    {y:1.5,h:sc(b.dy,b.y),c:COL.curve,t:`${PB.ny} = ${F7(b.y)} ± ${F7(b.dy)} ${PB.uy}`,on:k>=1},
    {y:0.5,h:sc(b.df,b.f),c:COL.orange,t:`${PB.nf} = ${F7(b.f)} ± ${F3(b.df)} ${PB.uf}`,on:k>=2}];
  const tlo=sc(b.lo-b.f,b.f),thi=sc(b.hi-b.f,b.f),M=Math.max(rows[0].h,rows[1].h,rows[2].h,Math.abs(tlo),Math.abs(thi))||1;
  const xr=view.xr||[-1.35*M,1.35*M];
  p.begin(xr,[-0.32,3.2],{h:H,ml:16});const fr=lineFrame(p,xr,null,small);
  for(const t of ticks(xr[0],xr[1],Math.max(3,Math.round(p.pw/(small?80:110)))))fr.tick(t,b.rel?(t>0?'+':'')+sg(fmt(100*t,3))+'%':(t>0?'+':'')+sg(fmt(t,3)));
  for(const r of rows){if(!r.on)continue;
    p.seg(-r.h,r.y,r.h,r.y,{c:r.c,w:9});
    for(const e of [-r.h,r.h])p.seg(e,r.y-0.13,e,r.y+0.13,{c:r.c,w:2.5});
    p.dot(0,r.y,5,COL.navy,'top');
    p.ptext(p.m.l+10,p.Y(r.y+0.38),r.t,{anchor:'start',c:r.c===COL.orange?COL.orange:COL.navy,weight:750,size:p.fs-1});}
  if(k>=3){const yy=0.5-0.27;p.seg(tlo,yy,thi,yy,{c:COL.teal,w:4});for(const e of [tlo,thi])p.seg(e,yy-0.08,e,yy+0.08,{c:COL.teal,w:2.5});
    p.ptext(p.m.l+p.pw-10,p.Y(-0.2),'true range (interval ends)',{anchor:'end',c:COL.teal,weight:750,size:p.fs-2});}
  p.end();}
function renderProp(k){
  if(!B||B.error){plot.begin([0,1],[0,1],{h:200,ml:16});plot.end();setFormula('');setStatus('bad',B?B.error:'');renderTable('tbl',[],[],-1);return;}
  drawProp(k);const b=B,P=PB,o=OPS[b.op];
  const iv=(c,d)=>`[${F7(c-d)}, ${F7(c+d)}]`;
  let l1,l2,l3;
  if(k===0){l1=`x: ${P.nx} = ${F7(b.x)} ± ${F7(b.dx)} ${P.ux}`;l2=`${P.nx} lies somewhere in ${iv(b.x,b.dx)}: an interval of width 2δx.`;l3='&nbsp;';}
  else if(k===1){l1=`y: ${P.ny} = ${F7(b.y)} ± ${F7(b.dy)} ${P.uy}`;l2=`${P.ny} lies somewhere in ${iv(b.y,b.dy)}.`;l3=`Worst case: assume the two errors combine to the largest possible error.`;}
  else{l1=`f = ${P.nf==='f'?'x '+o+' y':P.nf} = ${F7(b.x)} ${o} ${F7(b.y)} = <b>${F7(b.f)}</b> ${P.uf}`;
    if(!b.rel){l2=`δf = δx + δy = ${F7(b.dx)} + ${F7(b.dy)} = <b>${F3(b.df)}</b> ${P.uf}`;}
    else l2=`δf/|f| = δx/|x| + δy/|y| = ${F7(b.dx)}/${F7(Math.abs(b.x))} + ${F7(b.dy)}/${F7(Math.abs(b.y))} = ${F3(b.rx)} + ${F3(b.ry)} = <b>${F3(b.rf)}</b>`;
    l3=(b.rel?`δf = ${F3(b.rf)} × ${F7(Math.abs(b.f))} = ${F3(b.df)} ${P.uf}, so `:'')+`<span class="k-r">${P.nf} = ${F7(b.f)} ± ${F3(b.df)} ${P.uf}</span>`;}
  setFormula(`<span class="line1">${l1}</span><span class="line2">${l2}</span><span class="line3">${l3}</span>`);
  if(k<2)setStatus('info',`Step ${k} of ${S.last}. Press Step (&rarr;) to ${k===0?'add the second value':'combine the errors'}.`);
  else if(k===2)setStatus('ok',`Worst case: ${b.rel?'relative errors add':'absolute errors add'}. ${P.nf} = ${F7(b.f)} ± ${F3(b.df)} ${P.uf}`);
  else{const dlo=b.f-b.lo,dhi=b.hi-b.f;
    if(!b.rel)setStatus('ok',`From the interval ends: ${P.nf} ∈ [${F7(b.lo)}, ${F7(b.hi)}], exactly f ± δf: for + and − the worst-case bound is the true range.`);
    else setStatus('info',`From the interval ends: ${P.nf} ∈ [${F7(b.lo)}, ${F7(b.hi)}], i.e. f − ${fmt(dlo,5)} to f + ${fmt(dhi,5)}. The first-order bound δf = ${fmt(b.df,5)} drops terms of order δx·δy${b.op==='*'?' (here δx·δy = '+fmt(b.dx*b.dy,3)+')':''}, so it is approximate.`);}
  const rowsT=[[P.nx,F7(b.x),F7(b.dx),F3(b.dx/Math.abs(b.x)),iv(b.x,b.dx)]];
  if(k>=1)rowsT.push([P.ny,F7(b.y),F7(b.dy),F3(b.dy/Math.abs(b.y)),iv(b.y,b.dy)]);
  if(k>=2)rowsT.push([P.nf+' (worst case)',F7(b.f),F3(b.df),b.f!==0?F3(b.rf):'—',iv(b.f,b.df)]);
  if(k>=3)rowsT.push([P.nf+' (interval ends)',F7(b.f),'−'+F3(b.f-b.lo)+', +'+F3(b.hi-b.f),'—',`[${F7(b.lo)}, ${F7(b.hi)}]`]);
  renderTable('tbl',['quantity','value','δ','δ / |value|','interval'],rowsT,-1,{cellClass:i=>i===k?'new':''});}

/* ---------- wiring ---------- */
function render(k){if(PART==='round')renderRound(k);else renderProp(k);}
const S=Stepper(render);S.delay=1300;
/* a new step changes the unit of the number line, so the view resets */
const set0=S.set;S.set=k=>{if(PART==='round'&&k!==S.k){view.xr=null;view.yr=null;}set0(k);};
function recomputeA(){$('numErr').textContent='';
  try{X=parseX($('num').value);if(X.N===0n)throw new Error('Use a non-zero number.');}catch(e){X=null;$('numErr').textContent=e.message;}
  N0=Math.max(isSig()?1:0,Math.min(30,Math.round(num('n'))||0));
  const P=PRE_A.find(q=>q.id===$('presetA').value);
  XS=X?(P&&P.id==='pi'?'π = '+showX(X,24):P&&P.id==='23'?'2/3 = '+showX(X,24):showX(X,30)):'';
  S.last=X?(isSig()?N0-1:N0):0;view.xr=view.yr=null;S.pause();set0(0);}
function recomputeB(){B=readB();$('propErr').textContent=B.error||'';view.xr=view.yr=null;S.last=3;S.pause();set0(0);}
function setPart(){PART=$('part').value;$('grpA').hidden=PART!=='round';$('grpB').hidden=PART==='round';
  $('lede').textContent=PART==='round'?'Chopping discards the extra digits; rounding goes to the nearest candidate, and a tie goes to the even digit. Each step keeps one digit fewer.'
    :'Worst case: the errors conspire. Absolute errors add for + and −; relative errors add for × and ÷. Each step adds one piece.';
  $('partHint').textContent=PART==='round'?'Every row rounds the original x (never a rounded value again). Grey ticks: the candidate values at that precision.'
    :'Bars are drawn to scale: absolute offsets for + and −, relative offsets (%) for × and ÷.';
  $('plot').setAttribute('aria-label',PART==='round'?'Number line with the candidate values, x, the rounded and the chopped value':'Intervals of the two inputs and of the result, drawn to scale');
  if(PART==='round')recomputeA();else recomputeB();}
function applyB(P){PB=P;$('vx').value=P.x;$('dx').value=P.dx;$('vy').value=P.y;$('dy').value=P.dy;$('op').value=P.op;recomputeB();}
function customB(){const op=OPS[$('op').value];PB={id:'custom',nx:'x',ny:'y',nf:'f',ux:'',uy:'',uf:''};$('presetB').value='custom';recomputeB();}
fillSelect('presetA',PRE_A);fillSelect('presetB',PRE_B);$('presetA').value='1.3475';
onSelectChange('part',setPart);
onSelectChange('presetA',()=>{const P=PRE_A.find(q=>q.id===$('presetA').value);if(!P.v){$('num').focus();return;}
  $('num').value=P.v;$('mode').value=P.mode;$('n').value=P.n;recomputeA();});
$('num').addEventListener('input',debounce(()=>{$('presetA').value='custom';recomputeA();},300));
$('num').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
onSelectChange('mode',()=>{$('presetA').value='custom';if(isSig()&&num('n')<1)$('n').value=1;recomputeA();});
onNumber('n',debounce(()=>{$('presetA').value='custom';recomputeA();},250));
onSelectChange('presetB',()=>{const P=PRE_B.find(q=>q.id===$('presetB').value);if(P.id==='custom'){customB();return;}applyB(P);});
for(const id of ['vx','dx','vy','dy'])onNumber(id,debounce(customB,300));
onSelectChange('op',customB);
enablePanZoom(plot,view,()=>S.show(),{lockY:true});
bindViewControls([view],()=>S.show());
setPart();
</script>
</body>
