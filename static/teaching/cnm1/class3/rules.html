<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../theme.js"></script>
<title>Integration Rules</title>
<link rel="stylesheet" href="../demo.css">
<style>
@font-face{font-family:"CMU Sans Serif";src:url("fonts/cmunss.woff2") format("woff2");font-weight:400 600;font-display:swap}
@font-face{font-family:"CMU Sans Serif";src:url("fonts/cmunsx.woff2") format("woff2");font-weight:700 900;font-display:swap}
#tbl tr.sum td{border-top:2px solid var(--grey);font-weight:750}
#cmp tr.cur td{font-weight:750}
.ebar{display:inline-block;height:.6em;background:var(--orange);border-radius:2px;vertical-align:middle;margin-right:.4em;opacity:.8}
.custom-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:600px){.custom-row{grid-template-columns:1fr 1fr}.custom-row>:first-child{grid-column:1/-1}}
</style>
<link rel="stylesheet" href="../theme.css">
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>Integration rules</h1>
  <p class="lede">The shaded area is what the rule computes; the dots are where f is evaluated. Each step adds one strip, or one Gauss point.</p>
</header>
<main class="layout">
  <section class="plotcard">
    <svg class="plot" id="plot" role="img" aria-label="Integrand, quadrature nodes and the area computed by the rule"></svg>
    <p class="plot-hint">Drag to pan · scroll to zoom</p>
  </section>
  <aside class="side">
    <label class="field span2">f(x) and interval<select id="fsel"></select></label>
    <label class="field span2">Rule<select id="rsel"></select></label>
    <label class="field"><span id="nLab">Strips n</span><input id="n" type="number" step="1" min="1"></label>
    <div id="customBox" class="full" hidden>
      <div class="custom-row">
        <label class="field">Custom f(x)<input id="custom" type="text" value="exp(-x^2)" spellcheck="false" autocomplete="off"></label>
        <label class="field">a<input id="a" type="number" step="0.1" value="0"></label>
        <label class="field">b<input id="b" type="number" step="0.1" value="1"></label>
      </div>
      <div id="customErr" class="err"></div>
    </div>
    <p class="hint" id="nHint"></p>
    <p class="hint">Keys: &rarr; step, &larr; back, p play, r reset</p>
  </aside>
  <div class="controls btns">
    <button id="btnBack" type="button" title="Back (left arrow)">&larr; Back</button>
    <button id="btnStep" type="button" class="primary" title="Step (right arrow)">Step &rarr;</button>
    <button id="btnPlay" type="button" title="Play / pause (p)">Play</button>
    <button id="btnReset" type="button" title="Reset (r)">Reset</button>
    <button id="btnResetView" type="button" title="Restore the original graph view">Reset view</button>
  </div>
  <section class="results-card">
    <div class="formula wrap" id="formula">&nbsp;</div>
    <div class="status" id="status">&nbsp;</div>
    <div class="tablewrap scroll"><table id="tbl"></table></div>
    <p class="hint" id="cmpHead" style="margin:.9rem 0 .3rem;font-weight:700">Every rule with the same n</p>
    <div class="tablewrap scroll"><table id="cmp"></table></div>
  </section>
</main>
<footer style="margin-top:1rem;color:var(--grey);font-size:.8rem">© Andrea Nóvoa</footer>
</div>
<script src="../demo-core.js"></script>
<script>
"use strict";
/* integrands: four harder ones that separate the rules, then those from the Class 3 notes and labs */
const FPRE=[
 {id:'osc',label:'1 + sin(5x) on [0, π]   (oscillating)',f:x=>1+Math.sin(5*x),a:0,b:Math.PI,exact:Math.PI+0.4,exName:'π + 0.4'},
 {id:'runge',label:'1/(1 + 25x²) on [−1, 1]   (sharp peak)',f:x=>1/(1+25*x*x),a:-1,b:1,exact:0.4*Math.atan(5),exName:'(2/5) arctan 5'},
 {id:'damp',label:'e^(−x) cos(4x) on [0, 3]   (decaying oscillation)',f:x=>Math.exp(-x)*Math.cos(4*x),a:0,b:3,exact:(Math.exp(-3)*(4*Math.sin(12)-Math.cos(12))+1)/17},
 {id:'sqrt',label:'√x on [0, 1]   (infinite slope at 0)',f:x=>Math.sqrt(Math.max(0,x)),a:0,b:1,exact:2/3,exName:'2/3'},
 {id:'pi',label:'4/(1 + x²) on [0, 1]   (exact: π; worked example)',f:x=>4/(1+x*x),a:0,b:1,exact:Math.PI,exName:'π'},
 {id:'poly',label:'2x⁴ + 3x² on [−1, 1]   (exact: 2.8)',f:x=>2*x**4+3*x*x,a:-1,b:1,exact:2.8},
 {id:'exp',label:'e^(−x²) on [0, 1]',f:x=>Math.exp(-x*x),a:0,b:1,exact:0.746824132812427},
 {id:'xex',label:'x eˣ on [0, 2]   (exact: e² + 1)',f:x=>x*Math.exp(x),a:0,b:2,exact:Math.exp(2)+1,exName:'e² + 1'},
 {id:'one',label:'1 − e^(−x) on [0, 2]',f:x=>1-Math.exp(-x),a:0,b:2,exact:1+Math.exp(-2)},
 {id:'wavy',label:'2 + sin(1.5x) + 0.2x on [0, 4]',f:x=>2+Math.sin(1.5*x)+0.2*x,a:0,b:4,exact:8+(1-Math.cos(6))/1.5+1.6},
 {id:'lift',label:'√(1 − x²) on [0, 1]   (exact: π/4)',f:x=>Math.sqrt(Math.max(0,1-x*x)),a:0,b:1,exact:Math.PI/4,exName:'π/4'},
 {id:'custom',label:'Custom f(x)…'}
];
/* m: strips per polynomial piece (0 = rectangles), −1 = one Newton–Cotes polynomial, −2 = Gauss–Legendre; p: error ∝ h^p */
const RULES=[
 {id:'left',name:'Left Riemann sum',m:0,p:1},
 {id:'right',name:'Right Riemann sum',m:0,p:1},
 {id:'upper',name:'Upper Riemann sum',m:0,p:1},
 {id:'lower',name:'Lower Riemann sum',m:0,p:1},
 {id:'mid',name:'Mid-point rule',m:0,p:2},
 {id:'trap',name:'Trapezium rule',m:1,p:2},
 {id:'simp',name:'Simpson’s 1/3 rule',m:2,p:4},
 {id:'s38',name:'Simpson’s 3/8 rule',m:3,p:4},
 {id:'boole',name:'Boole’s rule',m:4,p:6},
 {id:'nc',name:'Newton–Cotes, one polynomial of degree d',m:-1},
 {id:'gl',name:'Gauss–Legendre quadrature',m:-2}
];
const NMAX={0:40,1:40,2:40,3:39,4:40,'-1':12,'-2':12};

/* Gauss–Legendre points (ascending) and weights on [−1, 1]: Newton's method on the Legendre recurrence */
const GLCACHE={};
function gaussLegendre(N){if(GLCACHE[N])return GLCACHE[N];const x=new Array(N),w=new Array(N);
  for(let i=1;i<=N;i++){let z=Math.cos(Math.PI*(i-0.25)/(N+0.5)),pp=1;
    for(let it=0;it<100;it++){let p1=1,p2=0;for(let j=1;j<=N;j++){const p3=p2;p2=p1;p1=((2*j-1)*z*p2-(j-1)*p3)/j;}
      pp=N*(z*p1-p2)/(z*z-1);if(N===1)pp=1;const z1=z;z=z1-p1/pp;if(Math.abs(z-z1)<1e-15)break;}
    x[N-i]=z;w[N-i]=2/((1-z*z)*pp*pp);}
  if(N%2===1)x[(N-1)/2]=0;
  return GLCACHE[N]={x,w};}
/* closed Newton–Cotes weights (per unit spacing) for nodes 0..d: integrate each Lagrange basis polynomial */
function ncWeights(d){const w=[];for(let j=0;j<=d;j++){let c=[1];
    for(let k=0;k<=d;k++){if(k===j)continue;const n=new Array(c.length+1).fill(0);
      for(let m=0;m<c.length;m++){n[m+1]+=c[m]/(j-k);n[m]+=-k*c[m]/(j-k);}c=n;}
    let s=0;for(let m=0;m<c.length;m++)s+=c[m]*Math.pow(d,m+1)/(m+1);w.push(s);}return w;}
/* reference value for a custom integrand: composite 20-point Gauss–Legendre on 200 panels */
function reference(f,a,b){const {x,w}=gaussLegendre(20);const P=200,H=(b-a)/P;let s=0;
  for(let p=0;p<P;p++){const c=a+(p+0.5)*H;for(let i=0;i<20;i++)s+=w[i]*f(c+H/2*x[i]);}return s*H/2;}
function lagr(xs,fs,x){let s=0;for(let j=0;j<xs.length;j++){let l=1;for(let k=0;k<xs.length;k++)if(k!==j)l*=(x-xs[k])/(xs[j]-xs[k]);s+=l*fs[j];}return s;}

/* apply a rule with n strips (or N points, or degree d): nodes [{x,f,w}], shapes to shade, the integral */
function applyRule(rule,f,a,b,n){
  const R={nodes:[],shapes:[],polys:[]};
  if(rule.m===0){const h=(b-a)/n;R.h=h;
    for(let i=0;i<n;i++){const x0=a+i*h,x1=x0+h;let xs;
      if(rule.id==='left')xs=x0;else if(rule.id==='right')xs=x1;else if(rule.id==='mid')xs=x0+h/2;
      else{xs=x0;let best=f(x0);for(let k=1;k<=200;k++){const t=x0+h*k/200,v=f(t);if(rule.id==='upper'?v>best:v<best){best=v;xs=t;}}}
      const fx=f(xs);R.nodes.push({x:xs,f:fx,w:h});R.shapes.push([[x0,0],[x0,fx],[x1,fx],[x1,0]]);}}
  else if(rule.m>0||rule.m===-1){const d=rule.m>0?rule.m:n,P=rule.m>0?n/rule.m:1,h=(b-a)/(P*d),W=ncWeights(d);R.h=h;
    const acc=new Map();
    for(let p=0;p<P;p++){const xs=[],fs=[];for(let j=0;j<=d;j++){const k=p*d+j,x=a+k*h,fx=f(x);xs.push(x);fs.push(fx);
        acc.set(k,{x,f:fx,w:(acc.has(k)?acc.get(k).w:0)+W[j]*h});}
      R.polys.push({xs,fs});}
    R.nodes=[...acc.keys()].sort((u,v)=>u-v).map(k=>acc.get(k));}
  else{const {x,w}=gaussLegendre(n);let left=a;
    for(let i=0;i<n;i++){const xi=(a+b)/2+(b-a)/2*x[i],fx=f(xi),wi=w[i]*(b-a)/2;R.nodes.push({x:xi,f:fx,w:wi,eta:x[i],wref:w[i]});
      R.shapes.push([[left,0],[left,fx],[left+wi,fx],[left+wi,0]]);left+=wi;}}
  R.I=R.nodes.reduce((s,q)=>s+q.w*q.f,0);return R;}

let F=null,RULE=RULES.find(r=>r.id==='simp');
const view={xr:null,yr:null};
const plot=new Plot($('plot'));
const stepN=()=>RULE.m>0?RULE.m:1;
const nMin=()=>RULE.m>0?RULE.m:1;
const nOf=k=>nMin()+k*stepN();
const sym=()=>RULE.m===-2?'N':RULE.m===-1?'d':'n';

function readF(){const id=$('fsel').value;
  if(id!=='custom'){const p=FPRE.find(q=>q.id===id);return{...p,kind:'exact'};}
  const a=num('a'),b=num('b');if(!(isFinite(a)&&isFinite(b)&&b>a))return{error:'Enter limits with a < b'};
  try{const f=compileExpr($('custom').value);const ex=reference(f,a,b);if(!isFinite(ex))return{error:'f is not finite on [a, b]'};
    return{f,a,b,exact:ex,kind:'reference'};}catch(e){return{error:e.message};}}

function ruleFormula(n){
  switch(RULE.id){
    case 'left':return `I ≈ h [f(x₀) + f(x₁) + … + f(x<sub>${n-1}</sub>)]`;
    case 'right':return `I ≈ h [f(x₁) + f(x₂) + … + f(x<sub>${n}</sub>)]`;
    case 'upper':return `I ≈ h Σ (largest f on each strip)`;
    case 'lower':return `I ≈ h Σ (smallest f on each strip)`;
    case 'mid':return `I ≈ h [f(x<sub>m,0</sub>) + … + f(x<sub>m,${n-1}</sub>)]`;
    case 'trap':return `I ≈ (h/2) [f₀ + 2f₁ + … + 2f<sub>${n-1}</sub> + f<sub>${n}</sub>]`;
    case 'simp':return `I ≈ (h/3) [f₀ + 4f₁ + 2f₂ + … + 4f<sub>${n-1}</sub> + f<sub>${n}</sub>]`;
    case 's38':return `I ≈ (3h/8) [f₀ + 3f₁ + 3f₂ + 2f₃ + … + 3f<sub>${n-1}</sub> + f<sub>${n}</sub>]`;
    case 'boole':return `I ≈ (2h/45) [7f₀ + 32f₁ + 12f₂ + 32f₃ + 14f₄ + … + 7f<sub>${n}</sub>]`;
    case 'nc':return `I ≈ Σ A<sub>j</sub> f<sub>j</sub>, &nbsp;A<sub>j</sub> = ∫ l<sub>j</sub>(x) dx`;
    case 'gl':return `I ≈ (b − a)/2 · Σ w<sub>i</sub> f(λ(η<sub>i</sub>))`;}}
function orderNote(n){
  if(RULE.m===-2)return `exact for polynomials up to degree 2N − 1 = ${2*n-1}`;
  if(RULE.m===-1)return `exact for polynomials up to degree ${n%2===0?n+1:n}`;
  return `error ∝ h${RULE.p===1?'':'<sup>'+RULE.p+'</sup>'}`;}

function render(k){
  const n=nOf(k);$('n').value=n;
  if(!F||F.error){plot.begin([0,1],[-1,1]);plot.axes();plot.end();setFormula('');setStatus('bad',F?F.error:'');renderTable('tbl',[],[],-1);return;}
  const R=applyRule(RULE,F.f,F.a,F.b,n),pad=(F.b-F.a)*0.08;
  const xr=view.xr||[F.a-pad,F.b+pad],yr=view.yr||autoY([F.f],xr[0],xr[1],{extra:R.nodes.map(q=>q.f)});
  const p=plot.begin(xr,yr);p.axes();
  const many=R.nodes.length>24;
  /* the area the rule computes: rectangles, or the area under each interpolating polynomial */
  if(R.polys.length){for(const Q of R.polys){const x0=Q.xs[0],x1=Q.xs[Q.xs.length-1],N=Math.max(24,Math.round((p.X(x1)-p.X(x0))/2));
      const top=[];for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;top.push([x,lagr(Q.xs,Q.fs,x)]);}
      p.area([[x0,0],...top,[x1,0]],COL.orange,0.16);
      p.path(top,{c:COL.orange,w:2.5,dash:RULE.m===1?null:'8 6'});
      p.seg(x1,0,x1,Q.fs[Q.fs.length-1],{c:COL.orange,w:1.2,op:.7});}
    p.seg(R.polys[0].xs[0],0,R.polys[0].xs[0],R.polys[0].fs[0],{c:COL.orange,w:1.2,op:.7});}
  else for(const s of R.shapes)p.area(s,COL.orange,0.16,COL.orange);
  p.curve(F.f,{c:COL.curve,w:3.5});
  for(const q of R.nodes){if(!many&&!R.polys.length)p.seg(q.x,0,q.x,q.f,{c:COL.grey,w:1.5,dash:'4 5'},'mid');p.dot(q.x,q.f,many?4.5:7,COL.orange,'top');}
  p.end();
  /* read-out */
  const err=F.exact-R.I,rel=Math.abs(err)/Math.max(1e-300,Math.abs(F.exact)),exk=F.kind==='exact'?'exact':'reference';
  const exName=F.exName?F.exName+' = ':'';
  const hTxt=RULE.m>=0?`, &nbsp;h = (b − a)/n = ${fmt(R.h,6)}`:RULE.m===-1?`: ${n+1} equispaced nodes, h = ${fmt(R.h,6)}`:`: η<sub>i</sub> = roots of P<sub>${n}</sub>`;
  setFormula(`<span class="line1">${RULE.name}, ${sym()} = <b>${n}</b>${hTxt}</span>`+
    `<span class="line2">${ruleFormula(n)} = <b>${fmt(R.I,10)}</b></span>`+
    `<span class="line3">${exk}: ${exName}${fmt(F.exact,10)}, &nbsp;error = ${exk} − I = ${fmt(err,3)}, &nbsp;relative ${fmt(rel,2)}</span>`);
  const ev=R.nodes.length,evTxt=`${ev} evaluation${ev>1?'s':''} of f`;
  if(rel<1e-13)setStatus('ok',`Exact to machine precision with ${evTxt} (${orderNote(n)})`);
  else if(k>0){const Rp=applyRule(RULE,F.f,F.a,F.b,nOf(k-1)),ep=Math.abs(F.exact-Rp.I),ratio=Math.abs(err)/ep;
    const expect=RULE.m>=0?Math.pow(nOf(k-1)/n,RULE.p):null;
    setStatus('info',`${sym()} = ${nOf(k-1)} → ${n}: |error| × ${fmt(ratio,3)}`+(expect!==null?` &nbsp;(${orderNote(n)} predicts × ${fmt(expect,3)})`:` &nbsp;(${orderNote(n)})`)+`; ${evTxt}`);}
  else setStatus('info',`${evTxt}; ${orderNote(n)}. Press Step (&rarr;) to add ${RULE.m===-2?'a Gauss point':RULE.m===-1?'a node':RULE.m>1?RULE.m+' strips (one more polynomial piece)':'a strip'}.`);
  /* nodes and weights */
  let head,rows;
  if(RULE.m===-2){head=['i','η<sub>i</sub>','w<sub>i</sub>','x<sub>i</sub> = λ(η<sub>i</sub>)','f(x<sub>i</sub>)','(b − a)/2 · w<sub>i</sub> f(x<sub>i</sub>)'];
    rows=R.nodes.map((q,i)=>[i,fmt(q.eta,10),fmt(q.wref,10),fmt(q.x,8),fmt(q.f,8),fmt(q.w*q.f,8)]);
    rows.push(['Σ','','','','','<b>'+fmt(R.I,10)+'</b>']);}
  else{head=['i','x<sub>i</sub>','f(x<sub>i</sub>)','weight w<sub>i</sub>','w<sub>i</sub> f(x<sub>i</sub>)'];
    rows=R.nodes.map((q,i)=>[i,fmt(q.x,8),fmt(q.f,8),fmt(q.w,8),fmt(q.w*q.f,8)]);
    rows.push(['Σ','','',fmt(R.nodes.reduce((s,q)=>s+q.w,0),8),'<b>'+fmt(R.I,10)+'</b>']);}
  renderTable('tbl',head,rows,-1);
  const last=$('tbl').querySelector('tbody tr:last-child');if(last)last.className='sum';
  compareAll(n);
}

/* Every rule at (about) the same n: the composite rules need n to be a multiple of their piece size */
function compareAll(n){
  const base=RULE.m>0?n:RULE.m===0?n:n;  // strips (or points / degree) of the current rule
  const cmpRules=['left','mid','trap','simp','s38','boole','gl'].map(id=>RULES.find(r=>r.id===id));
  const errs=[],rows=[];
  for(const r of cmpRules){
    let m=r.m>0?Math.max(r.m,Math.ceil(base/r.m)*r.m):Math.min(base,r.m===-2?12:base);
    const R=applyRule(r,F.f,F.a,F.b,m),e=Math.abs(F.exact-R.I);errs.push(e);
    rows.push({r,m,ev:R.nodes.length,I:R.I,e});}
  const lmax=Math.log10(Math.max(...errs,1e-16)),lmin=-16;
  const out=rows.map(q=>{const w=q.e<1e-16?0:Math.max(2,Math.round(70*(Math.log10(q.e)-lmin)/(lmax-lmin)));
    return[q.r.name.replace(' rule','').replace(' quadrature',''),(q.r.m===-2?'N = ':'n = ')+q.m,q.ev,fmt(q.I,10),
      `<span class="ebar" style="width:${w}px"></span>${q.e<1e-15?'&lt; 10⁻¹⁵':fmt(q.e,2)}`];});
  $('cmpHead').textContent=`Every rule with n = ${base} (rounded up where a rule needs a multiple), on the same integrand`;
  renderTable('cmp',['rule','n / N','evaluations of f','I','|error| (bar: log scale)'],out,-1);
  const cur=cmpRules.findIndex(r=>r.id===RULE.id);
  if(cur>=0){const tr=$('cmp').querySelectorAll('tbody tr')[cur];if(tr)tr.className='cur';}
}

const S=Stepper(render);S.delay=1100;
function setRule(keepN){const nPrev=nOf(S.k);RULE=RULES.find(r=>r.id===$('rsel').value);
  S.last=Math.floor((NMAX[String(RULE.m)]-nMin())/stepN());
  $('nLab').textContent=RULE.m===-2?'Gauss points N':RULE.m===-1?'Degree d':'Strips n';
  $('n').min=nMin();$('n').step=stepN();$('n').max=NMAX[String(RULE.m)];
  $('nHint').textContent=RULE.m>1?`n must be a multiple of ${RULE.m}: one polynomial of degree ${RULE.m} through every ${RULE.m+1} nodes.`
    :RULE.m===-2?'Gauss points are the roots of the Legendre polynomial. Each shaded rectangle has width (b − a)/2 · wᵢ and height f(xᵢ).'
    :RULE.m===-1?'One polynomial through d + 1 equispaced nodes. High degrees can oscillate (Runge phenomenon, Class 4).'
    :RULE.id==='upper'||RULE.id==='lower'?'Largest or smallest value of f on each strip (found by sampling the strip).':'';
  S.pause();S.set(keepN?Math.round((Math.max(nMin(),nPrev)-nMin())/stepN()):S.k);}
function recompute(){F=readF();$('customErr').textContent=F.error||'';view.xr=null;view.yr=null;S.show();}
fillSelect('fsel',FPRE);fillSelect('rsel',RULES.map(r=>({id:r.id,label:r.name})));$('rsel').value='simp';
onSelectChange('fsel',()=>{$('customBox').hidden=$('fsel').value!=='custom';recompute();});
onSelectChange('rsel',()=>setRule(true));
$('n').addEventListener('input',()=>{const v=Math.round(num('n'));if(!isFinite(v))return;S.pause();S.set(Math.round((Math.max(nMin(),v)-nMin())/stepN()));});
$('n').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
$('custom').addEventListener('input',debounce(recompute,300));
for(const id of ['a','b']){$(id).addEventListener('input',debounce(recompute,300));$(id).addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});}
enablePanZoom(plot,view,()=>S.show());
bindViewControls([view],()=>S.show());
$('fsel').value='osc';
F=readF();setRule(false);S.set(0); /* start coarse on an oscillating integrand, where the rules clearly differ */
</script>
</body>
</html>
