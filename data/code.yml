# GitHub organisations the group publishes through.
orgs:
  - key: sciml-da
    name: "SciML-DA"
    url: "https://github.com/SciML-DA"
    blurb: "Code released with our papers and student projects."
  - key: andreanovoa
    name: "andreanovoa"
    url: "https://github.com/andreanovoa"
    blurb: "Core methods, tutorials and general-purpose tooling for dynamical systems."

# Software packages released with a citable DOI. `doi` is the concept DOI,
# which always resolves to the latest version. `figure` is an optional graphical
# abstract shown beside the description; `invertDark` flips it in the dark theme.
# `pypi` links the package page, which always shows the current release.
repos:
  - name: "echostatenetwork"
    figure: "img/code/echostatenetwork.svg"
    invertDark: true
    org: andreanovoa
    url: "https://github.com/andreanovoa/EchoStateNetwork"
    docs: "/docs/echostatenetwork/"
    pypi: "https://pypi.org/project/echostatenetwork/"
    doi: "10.5281/zenodo.23266679"
    date: "2026"
    license: "MIT"
    description: "Echo state networks in pure numpy: ridge-regression training with chaotic recycle validation, parametric inputs, Bayesian hyperparameter search, closed-loop prediction, and Jacobians for data assimilation, with a parallel layout of one reservoir per patch for spatially extended systems. The reservoir core behind qlroms and romda. Includes a live demo that builds a network from your choices."

  - name: "ntsa"
    figure: "img/code/ntsa.png"
    invertDark: true
    org: andreanovoa
    url: "https://github.com/andreanovoa/ntsa"
    docs: "/docs/ntsa/"
    pypi: "https://pypi.org/project/ntsa/"
    doi: "10.5281/zenodo.21843575"
    date: "2026"
    license: "MIT"
    description: "Nonlinear time-series analysis of dynamical systems from a single long trajectory: Lyapunov exponents, delay-embedding analysis, and classification of the dynamical regime (fixed point, limit cycle, quasiperiodicity, chaos), with diagnostic figures for each case. Works with any model following the dynamodels protocol."

  - name: "romda"
    figure: "img/code/romda.svg"
    invertDark: true
    org: andreanovoa
    url: "https://github.com/andreanovoa/real-time-bias-aware-DA"
    docs: "https://andreanovoa.github.io/real-time-bias-aware-DA/"
    pypi: "https://pypi.org/project/romda/"
    license: "MIT"
    description: "Real-time reduced-order modelling and bias-aware data assimilation: ensemble Kalman filters including the regularized bias-aware EnKF, physical and data-driven forecast models (ESN, POD-ESN), bias estimators, and POD/SPOD decompositions, with tutorials building up to full real-data digital twins."

  - name: "qlroms"
    figure: "img/code/qlroms.png"
    invertDark: true
    org: andreanovoa
    url: "/docs/qlroms/"
    docs: "/docs/qlroms/"
    pypi: "https://pypi.org/project/qlroms/"
    license: "MIT"
    description: "Quantized-local reduced-order models: the state space is partitioned into charts by k-means, each chart gets its own local POD basis, and an exact shared atlas stitches them into one global coordinate system, with the local dynamics advanced by an intrusive Galerkin projection. Includes live demos on a travelling wave of the 2-D Kuramoto–Sivashinsky equation and on the chaotic 1-D case."

  - name: "dynamodels"
    figure: "img/code/dynamodels.png"
    invertDark: true
    org: andreanovoa
    url: "https://github.com/andreanovoa/dynamodels"
    docs: "/docs/dynamodels/"
    pypi: "https://pypi.org/project/dynamodels/"
    doi: "10.5281/zenodo.21843588"
    date: "2026"
    license: "MIT"
    description: "Dynamical-system models with history tracking and pluggable integrators. Currently includes Van der Pol, Rijke, annular thermoacoustics, Kuramoto–Sivashinsky, Lorenz 63 and Lorenz 96."

# Zenodo profile (uploads are made under the andreanovoa account).
zenodo:
  name: "Zenodo"
  url: "https://zenodo.org/search?q=creators.orcid%3A%220000-0003-0597-8326%22"
  blurb: "Datasets that accompany the group's papers are archived on Zenodo, each with a citable DOI."

# Archived datasets. `doi` is the concept DOI, which always resolves to the latest version.
datasets:
  - title: "A real-time digital twin of azimuthal thermoacoustic instabilities"
    url: "https://doi.org/10.5281/zenodo.15609831"
    doi: "10.5281/zenodo.15609831"
    figure: "img/pubs/digital-twin.webp"
    date: "2024"
    license: "CC BY 4.0"
    size: "1.5 GB"
    description: >-
      Acoustic pressure data from an annular combustor, recorded by four microphones at 0°, 60°, 120° and 240°,
      for four equivalence ratios between 0.4875 and 0.575 at a constant power of 6 kW. Originally created by
      Indlekofer et al. (2022); also used by the tutorials in real-time-bias-aware-DA.
    paper: "https://doi.org/10.1017/jfm.2024.1052"
    paperTitle: "A real-time digital twin of azimuthal thermoacoustic instabilities (JFM, 2024)"
